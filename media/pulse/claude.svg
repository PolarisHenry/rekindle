<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
<style>
@keyframes breathe { 0%,100% { opacity:.3 } 50% { opacity:1 } }
circle { animation:breathe 1.8s ease-in-out infinite; }
